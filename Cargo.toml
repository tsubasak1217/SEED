# ============================================================
#  SEED ワークスペースルート
#
#  メンバー:
#    runtime/          — エンジン本体 (SEED.exe)
#    plugin_api/       — プラグイン作成者向け API クレート (trait 定義のみ)
#    plugins/*/        — 各プラグイン DLL クレート
# ============================================================

[workspace]
members  = [
    "runtime",
    "plugin_api",
    "plugins/sample_plugin",
]
resolver = "2"

# ── デバッグビルドのパフォーマンス最適化 ──────────────────────────────
# wgpu は debug ビルドで RenderPass ドロップ時に全コマンドを unoptimized なコードで
# 処理するため、25 体以上のアクターで ~20ms/frame の CPU オーバーヘッドが発生する。
# wgpu 関連クレートのみ opt-level=2 でコンパイルすることで、アプリケーションの
# デバッグ情報・アサーションを維持しつつ GPU コマンド処理を大幅に高速化する。
[profile.dev.package.wgpu]
opt-level = 2
[profile.dev.package.wgpu-core]
opt-level = 2
[profile.dev.package.wgpu-hal]
opt-level = 2
[profile.dev.package.wgpu-types]
opt-level = 2
[profile.dev.package.ash]
opt-level = 2
[profile.dev.package.naga]
opt-level = 2

# ── 派生データキャッシュのパフォーマンス最適化 ────────────────────────
# アセットキャッシュ（asset_cache）はテクスチャの BC 圧縮（texpresso）と
# bincode/serde によるシリアライズを行う。これらは計算量が大きく、
# unoptimized な debug ビルドでは初回圧縮・キャッシュ読み書きが数十倍遅くなる
# ため、wgpu と同様に依存クレート側のみ opt-level=2 でコンパイルする。
# 画像デコード（png/jpeg）は初回ロードの支配的コストのため同様に最適化する。
[profile.dev.package.texpresso]
opt-level = 2
[profile.dev.package.bincode]
opt-level = 2
[profile.dev.package.serde]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2
[profile.dev.package.fdeflate]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 2
