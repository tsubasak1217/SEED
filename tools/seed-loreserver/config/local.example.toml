# =============================================================================
# seed-loreserver ローカル動作確認用 設定サンプル
# =============================================================================
# 使い方:
#   1. このファイルを実際に使う設定ディレクトリへ `local.toml` という名前で
#      コピーする（ファイル名が重要。詳細は下の「設定の読み込み順」を参照）。
#   2. パス（store_path / lock ファイル）を自分の環境に合わせて書き換える。
#      Windows では `\` ではなく `/` か `\\` を使うこと（TOML のエスケープ）。
#   3. 起動:
#        set RUST_LOG=info
#        seed-loreserver.exe --config <設定ディレクトリ>
#
# 設定の読み込み順（lore-server/src/settings.rs の Settings::load）:
#   (a) バイナリに埋め込まれた default.toml
#   (b) <config>/default.toml       （任意）
#   (c) <config>/<env>.toml         （任意、env の既定は "local"）
#   (d) <config>/<env>_<region>.toml（任意、環境変数 LORE_PLATFORM_REGION 指定時）
#   (e) <config>/local.toml         （任意）
#   (f) 環境変数 LORE__*
#   後から読まれたものが勝つ。既定の env が "local" なので (c) と (e) は
#   どちらも `local.toml` を指し、結果として 1 回だけ読まれる。
#
# ログについての注意:
#   lore-server のログ購読は EnvFilter::from_default_env() を使うため、
#   環境変数 RUST_LOG が未設定だと ERROR 以外は一切出力されない。
#   フックのログを確認したいときは必ず RUST_LOG=info を付けること。
# =============================================================================

# -----------------------------------------------------------------------------
# ポートと待ち受けアドレス
# -----------------------------------------------------------------------------
# 既定は QUIC/gRPC=41337、HTTP=41339 だが、このサンプルでは
# 素の loreserver と同時に動かしても衝突しないよう +10 した番号を使う。
# 本番用に切り出すときは既定ポートへ戻すこと。
#
# host は 127.0.0.1 に絞る。0.0.0.0 にすると LAN 全体へ公開され、
# Windows ファイアウォールの許可ダイアログも出る。
# -----------------------------------------------------------------------------

[server.quic]
enabled = true
host = "127.0.0.1"
port = 41347
# 証明書を指定しない場合、サーバは起動のたびに自己署名証明書を生成する。
# 恒久運用ではここを埋めて、再起動をまたいで同じ証明書を使うこと。
# [server.quic.certificate]
# cert_file = "C:/loreserver/certs/cert.pem"
# pkey_file = "C:/loreserver/certs/key.pem"

[server.grpc]
enabled = true
host = "127.0.0.1"
port = 41347

[server.http]
enabled = true
host = "127.0.0.1"
port = 41349

# レプリケーション用の内部エンドポイントは単機運用では不要。
[server.quic_internal]
enabled = false

[server.grpc_internal]
enabled = false

# -----------------------------------------------------------------------------
# ストア構成
# -----------------------------------------------------------------------------
# immutable / mutable はローカルファイルシステム（upstream 標準の "local"）。
# lock だけを SEED 独自のファイル永続化プラグインへ差し替える。
# -----------------------------------------------------------------------------

[immutable_store]
mode = "local"

[mutable_store]
mode = "local"

# ここが本 crate の存在理由。
# upstream の "local" はプロセス内メモリ（DashMap）なので再起動で消える。
# "seed_file_lock_store" は JSON ファイルへ永続化する。
[lock_store]
mode = "seed_file_lock_store"

[immutable_store.local]
path = "C:/loreserver/store"
flush_delay_seconds = 10

[mutable_store.local]
path = "C:/loreserver/store"
flush_delay_seconds = 10

# -----------------------------------------------------------------------------
# SEED 独自プラグインの設定
# -----------------------------------------------------------------------------
# セクション名は [lock_store] mode に書いたプラグイン名と一致させる。
# lore-server は [plugins.<mode>.lock_store] を優先し、
# 無ければ [plugins.<mode>] を使う（store/configuration.rs の
# resolve_plugin_config_with_fallback）。
# -----------------------------------------------------------------------------

[plugins.seed_file_lock_store]
# ロックの保存先 JSON ファイル。
# 相対パスを書いた場合はサーバプロセスのカレントディレクトリ基準になるので、
# 運用では絶対パスを推奨。
# 書き込みは「<path>.tmp へ書く → rename」の原子的置換で行う。
path = "C:/loreserver/locks/seed_locks.json"

# -----------------------------------------------------------------------------
# SEED 独自フックの設定
# -----------------------------------------------------------------------------
# enabled を省略／false にするとフックは生成されない（HookSettings の既定）。
# 未登録のフック名を書くとサーバは起動時に panic するので注意。
# -----------------------------------------------------------------------------

# NOTE: 認証（[server.auth.jwk]）を設定しないと、push のユーザーもロックの owner も
#       常に "<unknown>" になる（lore-server/src/util/mod.rs::get_user_id_from_token_ref）。
#       「他人がロック中のファイル」を判定したいなら JWT 認証が前提。
[hooks.seed_push_guard]
# フック自体の有効・無効。
enabled = true
# true にすると、すべての push を FAILED_PRECONDITION で拒否する。
# （PERMISSION_DENIED はクライアント側で拒否理由が捨てられるため使わない。
#   理由は src/hooks/push_guard.rs の REJECT_STATUS コメントを参照）
# メンテナンス中の緊急停止と、拒否経路の動作確認用。
# 他人がロック中のファイルを含む push の拒否は未実装（README 参照）。
reject_all = false

# -----------------------------------------------------------------------------
# テレメトリ
# -----------------------------------------------------------------------------
# ローカル確認では人が読めるほうがよいので ansi。
# サーバ運用では default.toml の既定（json）に戻すこと。
# -----------------------------------------------------------------------------

[telemetry.logger]
format = "ansi"
output = "stdout"
enable_otlp = false

# -----------------------------------------------------------------------------
# トポロジ
# -----------------------------------------------------------------------------
# 単機運用なのでピア探索なし。
# -----------------------------------------------------------------------------

[topology]
provider = "none"

# -----------------------------------------------------------------------------
# 通知
# -----------------------------------------------------------------------------
# プロセス内ブロードキャストのみ。外部依存なし。
# -----------------------------------------------------------------------------

[notification]
mode = "local"
