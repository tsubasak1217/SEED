[package]
name = "SEED"
version = "0.1.0"
edition = "2024"
# cargo のパッケージファイル走査（ビルドスクリプトの再実行判定・packaging）から
# アセット（かつて runtime/assets に junction で置いていた数百 MB。現在はプロジェクト側 projects/<Name>/assets）を外す。
# 走査対象に入っていると毎ビルドが遅く、権限の壊れたフォルダがあると
# "failed to determine package fingerprint" で失敗する。
exclude = ["assets/**", "save/**", "logs/**"]

[dependencies]
winit = "0.30"
wgpu = "25"
pollster = "0.3"
raw-window-handle = "0.6"
gltf = { version = "1", features = ["utils", "KHR_materials_transmission"] }
tobj = "4"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
# hdr = Radiance HDR(.hdr / RGBE), exr = OpenEXR(.exr)。いずれも float デコード対応（スカイボックス HDR 用）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp", "hdr", "exr"] }
# f32 → f16 変換（HDR テクスチャを Rgba16Float でアップロードするため。wgpu の推移的依存として既にビルドツリーに存在）。
half = { version = "2", features = ["bytemuck"] }
rayon = "1"
meshopt = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 派生データキャッシュ（モデル/テクスチャの即ロード形式シリアライズ）
bincode = "1"
# GPU テクスチャ圧縮（純 Rust の BC 圧縮。BC1/BC3/BC4/BC5 対応）。
# intel_tex_2（ISPC）は事前コンパイル済みオブジェクトが /MD（動的 CRT）で、
# 本プロジェクトがリンクする nethost.lib（/MT・静的 CRT）と RuntimeLibrary が
# 衝突（LNK2038）しリンク不能なため、C 依存のない純 Rust の texpresso を採用。
texpresso = "2"
# glTF 画像の遅延デコード用（data URI の base64 / 外部 URI のパーセントデコード）。
# いずれも gltf クレートの推移的依存として既にビルドツリーに存在する。
base64 = "0.22"
urlencoding = "2"
naga = { version = "25", features = ["wgsl-in"] }
toml  = "0.8"
netcorehost = "0.20"
libloading = "0.8"
seed-plugin-api    = { path = "../plugin_api" }
rapier3d           = { version = "0.22", features = ["simd-stable"] }
rapier2d           = { version = "0.22", features = ["simd-stable"] }
crossbeam-channel  = "0.5"
# オーディオ再生（スクリプト Audio API 用。wav / ogg / mp3 / flac をデコード可能）
rodio              = "0.20"
# ゲームパッド入力（.inputmap の GamepadButton / GamepadAxis 評価基盤）。
# クロスプラットフォームのパッド抽象。毎フレーム next_event() でイベントをポンプする。
gilrs              = "0.11"

[target.'cfg(windows)'.dependencies]
# 追加 feature の用途（起動ログ機構 core/startup_log/）:
#   Win32_System_Console          … SetStdHandle / STD_OUTPUT_HANDLE・STD_ERROR_HANDLE（標準ハンドルの差し替え）
#   Win32_Storage_FileSystem      … CreateFileW / GetFileAttributesExW / FileTimeToLocalFileTime（ログファイル作成・exe 更新日時）
#   Win32_Security                … CreateFileW の SECURITY_ATTRIBUTES 引数（FileSystem が要求する）
#   Win32_System_SystemInformation… GetLocalTime / OSVERSIONINFOW（ログの日時・OS バージョン）
#   Win32_System_Time             … FileTimeToSystemTime（exe 更新日時の変換）
#   Wdk_System_SystemServices     … RtlGetVersion（マニフェストの影響を受けない実 OS バージョン）
windows-sys = { version = "0.59", features = ["Win32_System_Pipes", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Media", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Time", "Wdk_System_SystemServices"] }