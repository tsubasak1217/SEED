[package]
name = "SEED"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = "25"
pollster = "0.3"
raw-window-handle = "0.6"
gltf = { version = "1", features = ["utils", "KHR_materials_transmission"] }
tobj = "4"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp"] }
rayon = "1"
meshopt = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 派生データキャッシュ（モデル/テクスチャの即ロード形式シリアライズ）
bincode = "1"
# GPU テクスチャ圧縮（純 Rust の BC 圧縮。BC1/BC3/BC4/BC5 対応）。
# intel_tex_2（ISPC）は事前コンパイル済みオブジェクトが /MD（動的 CRT）で、
# 本プロジェクトがリンクする nethost.lib（/MT・静的 CRT）と RuntimeLibrary が
# 衝突（LNK2038）しリンク不能なため、C 依存のない純 Rust の texpresso を採用。
texpresso = "2"
# glTF 画像の遅延デコード用（data URI の base64 / 外部 URI のパーセントデコード）。
# いずれも gltf クレートの推移的依存として既にビルドツリーに存在する。
base64 = "0.22"
urlencoding = "2"
naga = { version = "25", features = ["wgsl-in"] }
toml  = "0.8"
netcorehost = "0.20"
libloading = "0.8"
seed-plugin-api    = { path = "../plugin_api" }
rapier3d           = { version = "0.22", features = ["simd-stable"] }
rapier2d           = { version = "0.22", features = ["simd-stable"] }
crossbeam-channel  = "0.5"
# オーディオ再生（スクリプト Audio API 用。wav / ogg / mp3 / flac をデコード可能）
rodio              = "0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Pipes", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Media"] }