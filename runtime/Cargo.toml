[package]
name = "SEED"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = "25"
pollster = "0.3"
raw-window-handle = "0.6"
gltf = { version = "1", features = ["utils"] }
tobj = "4"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp"] }
rayon = "1"
meshopt = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
naga = { version = "25", features = ["wgsl-in"] }
toml  = "0.8"
netcorehost = "0.20"
libloading = "0.8"
seed-plugin-api    = { path = "../plugin_api" }
rapier3d           = { version = "0.22", features = ["simd-stable"] }
rapier2d           = { version = "0.22", features = ["simd-stable"] }
crossbeam-channel  = "0.5"
# オーディオ再生（スクリプト Audio API 用。wav / ogg / mp3 / flac をデコード可能）
rodio              = "0.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Pipes", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }