# post_wboit_composite.toml — WBOIT 合成パス（Phase R5）
# accum(group0) / reveal(group1) を読み、シーン HDR の上へアルファブレンドで重ねる。
# 出力は HDR（from_toml に渡す hdr_format=Rgba16Float へ color_format="surface" が解決）。
# 実際の描画（LoadOp::Load）は transparency.rs の composite_wboit が行う。

shader_sources = ["fullscreen.wgsl", "post_wboit_composite.wgsl"]
vertex_entry   = "fs_vs"
fragment_entry = "composite_fs"
vertex_slots   = []

topology     = "TriangleList"
cull_mode    = "None"
color_format = "surface"
blend        = "AlphaBlending"
no_depth     = true
