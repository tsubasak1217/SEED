# post_bloom_prefilter.toml — ブルーム しきい値抽出（Phase R4）
# シーン HDR から高輝度成分を抽出してブルーム mip0（半解像度・HDR）へ出力する。
# 出力フォーマットは PostPipeline 構築時に渡す HDR フォーマット（Rgba16Float）へ解決される。

shader_sources = ["fullscreen.wgsl", "post_bloom_prefilter.wgsl"]
vertex_entry   = "fs_vs"
fragment_entry = "bloom_prefilter_fs"
vertex_slots   = []

topology     = "TriangleList"
cull_mode    = "None"
color_format = "surface"
blend        = "Replace"
no_depth     = true
