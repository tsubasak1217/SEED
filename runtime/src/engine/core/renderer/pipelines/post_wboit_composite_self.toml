# post_wboit_composite_self.toml — WBOIT 合成 パス2: 曲がった透明色の加算（曲げと色フィルタの分離）
# avg*C*ΠT（C=1-reveal.a=カバレッジ、ΠT=reveal.rgb=色フィルタ）を、背景の曲げ濾過済み HDR
#（=scene*(1-C)*ΠT）へ加算する。合計 = [scene*(1-C)+avg*C]*ΠT = lerp(scene,avg,C)*ΠT。
# blend=Additive（src=One/dst=One）。src.a=0 のため HDR.a は不変。
# パス1（背景の曲げ濾過）の後に描くこと。composite_wboit が順序を保証する。

shader_sources = ["fullscreen.wgsl", "post_wboit_composite.wgsl"]
vertex_entry   = "fs_vs"
fragment_entry = "composite_self_fs"
vertex_slots   = []

topology     = "TriangleList"
cull_mode    = "None"
color_format = "surface"
blend        = "Additive"
no_depth     = true
