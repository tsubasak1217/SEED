# post_wboit_composite_self.toml — WBOIT 合成 パス2: 透明色混合（色付き透過率＋屈折歪み・凸結合）
# avg*(1-reveal.rgb)（per-channel）を、背景濾過済み HDR（=scene*ΠT）へ加算する。
# 合計 = scene*ΠT + avg*(1-ΠT) ＝ チャンネルごとの凸結合 lerp(avg, scene, ΠT)。
# blend=Additive（src=One/dst=One）。src.a=0 のため HDR.a は不変。
# パス1（背景濾過）の後に描くこと。composite_wboit が順序を保証する。

shader_sources = ["fullscreen.wgsl", "post_wboit_composite.wgsl"]
vertex_entry   = "fs_vs"
fragment_entry = "composite_self_fs"
vertex_slots   = []

topology     = "TriangleList"
cull_mode    = "None"
color_format = "surface"
blend        = "Additive"
no_depth     = true
