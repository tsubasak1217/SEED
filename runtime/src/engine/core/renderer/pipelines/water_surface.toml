# water_surface.toml — 水面描画パス（Phase W1）
#
# 頂点バッファを一切使わず（vertex_slots = []）、draw(0..6, 0..N) の 1 ドローで
# 全水ボリュームのクアッドを描く。頂点は vertex_index、パラメータは instance_index から引く。
#
# no_depth = true: 深度アタッチメントを持たない。共有深度テクスチャは他パスで書き込み可能として
# アタッチされており、同一パスでアタッチメント兼サンプルにするとエイリアシングになるため、
# 深度は group1 の t_depth（DepthOnly ビュー）としてサンプルし、シェーダ内で手動深度テストを行う。
# 水面は元々深度を書かないので挙動は通常の Z テストと等価。
#
# cull_mode = "None": 水中視点（W2）で水面を裏側からも見るため、両面を描く。
#
# blend = "Replace": 屈折の背景をシェーダ内で合成済み（alpha=1 を出力）なので、
# ブレンドは行わず上書きする。
# shader_sources: 形状・高さ場の共有モジュールを **先に** 連結する
# （WGSL は宣言前の識別子を参照できないため順序は固定）。
#
# 連結順の意味（Phase W8 で 2 本 → 4 本になった）:
#   1. water_height_field.wgsl     形状・高さ場・WaterParams・WATER_EPSILON（ID/反射パスと共有）
#   2. water_shading_contract.wgsl 水面シェーディング契約 v1（WaterShadeInput / water_shade_default）
#   3. water_shade_dispatch.wgsl   契約関数 water_shade_entry の **既定実装**。
#                                  水域に surface_shader が指定されている場合、Rust 側
#                                  （water/shading_asset.rs）が **この 1 要素を**
#                                  「アセット本体 ＋ 生成した water_shade_entry」へ差し替える。
#                                  差し替え位置の目印なので、要素名を変えるときは
#                                  water/shading_asset.rs の WATER_DISPATCH_SOURCE_NAME も直すこと。
#   4. water_surface.wgsl          頂点/フラグメント本体（材料を集めて契約へ渡す）
shader_sources  = [
    "water_height_field.wgsl",
    "water_shading_contract.wgsl",
    "water_shade_dispatch.wgsl",
    "water_surface.wgsl",
]
vertex_entry    = "vs_water"
fragment_entry  = "fs_water"
vertex_slots    = []
# 頂点変位（Phase W5.1）で group1 のショアフィールドと group2 の波紋の場を
# **頂点シェーダから**サンプルする。リフレクションは既定でテクスチャ・サンプラーを
# FRAGMENT 可視にするため、ここで VERTEX 可視にすべき group を明示する
# （指定を忘れると「頂点段から見えない binding」でパイプライン生成が失敗する）。
vertex_visible_groups = [1, 2]

topology        = "TriangleList"
cull_mode       = "None"
front_face      = "Ccw"

no_depth        = true

color_format    = "surface"
blend           = "Replace"
write_mask      = "all"
