# caustics.toml — 水中コースティクス生成パス（Phase W5.3）
#
# 頂点バッファ無しのフルスクリーン三角形 1 枚で、シーン深度から復元した
# ワールド座標が水面より下なら、水色（浅場/深場の吸収則）で着色した
# 集光寄与 RGB（Rgba16Float、A 未使用）を書き出す。
#
# shader_sources: 高さ場は **water_surface.toml / water_id.toml とまったく同じ
#   共有モジュール**を連結して使う（＝水面の見た目と水底の模様が同じ波を見る）。
#   WGSL は宣言前の識別子を参照できないため、共有モジュールが必ず先。
#
# num_bind_groups = 4: group0=カメラ / group1=水パラメータ＋岸波 /
#   group2=波紋の場 / group3=シーン深度＋本パス専用 UBO。
#
# vertex_visible_groups は **指定しない**。頂点段はただの三角形生成で
#   高さ場を一切読まないため、リフレクション既定（FRAGMENT 可視）で足りる。
#
# no_depth = true: 深度はアタッチメントではなく **サンプルテクスチャ**として読む
#   （共有深度は他パスで書き込み可能としてアタッチされており、同一パスで
#    アタッチメント兼サンプルにすると read/write 競合になる。water_surface と同じ理由）。
#
# blend = "None": 生成結果を上書きする（クリア値 0＝寄与なしの上へ書く）。
shader_sources  = ["water_height_field.wgsl", "caustics.wgsl"]
vertex_entry    = "vs_fullscreen"
fragment_entry  = "fs_caustics"
vertex_slots    = []
num_bind_groups = 4

topology        = "TriangleList"
cull_mode       = "None"
front_face      = "Ccw"

no_depth        = true

color_format    = "Rgba16Float"
blend           = "None"
write_mask      = "all"
