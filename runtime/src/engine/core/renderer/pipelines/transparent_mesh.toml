# transparent_mesh.toml — 距離ソート透明スタティックメッシュ（Phase R5）
# mesh.toml と同一のシェーダ連結・BGL レイアウトだが、アルファブレンド有効・
# 深度書き込みなし・depth_compare=LessEqual にして半透明を背面から前面へ重ねる。
# カラーフォーマットは HDR（PostPipeline 同様 color_format="surface" が
# ビルド時に渡す scene_format=Rgba16Float へ解決される）。

# 背景取得はスクリーンスペース（refract_ss.wgsl）。RT 対応 GPU・translucency=Rt では
# transparent_mesh_rt.toml が refract_rt.wgsl（本物の屈折レイ）で置き換える。
shader_sources  = ["cluster_common.wgsl", "pbr_common.wgsl", "shader_common.wgsl", "ddgi_common.wgsl", "light_common.wgsl", "shadow.wgsl", "rt_shadow_off.wgsl", "shader_static_vertex.wgsl", "surface.wgsl", "surface_gather.wgsl", "shading_contract.wgsl", "shading_dispatch.wgsl", "lighting_eval.wgsl", "shader_fragment.wgsl", "refract_common.wgsl", "refract_ss.wgsl", "shader_transparent.wgsl"]
vertex_entry    = "vs_main"
fragment_entry  = "fs_transparent_sorted"
vertex_slots    = ["mesh_vertex"]

topology        = "TriangleList"
cull_mode       = "Back"
front_face      = "Ccw"

depth_write     = false
depth_compare   = "LessEqual"

color_format    = "surface"
# premultiplied over（RT-Translucency）。fs_transparent_sorted が premultiplied 色を出力する。
# 屈折オフ時は (lit*a, a) を出すため straight AlphaBlending と等価＝Raster 見た目一致。
blend           = "PremultipliedAlpha"
write_mask      = "all"
