# transparent_mesh.toml — 距離ソート透明スタティックメッシュ（Phase R5）
# mesh.toml と同一のシェーダ連結・BGL レイアウトだが、アルファブレンド有効・
# 深度書き込みなし・depth_compare=LessEqual にして半透明を背面から前面へ重ねる。
# カラーフォーマットは HDR（PostPipeline 同様 color_format="surface" が
# ビルド時に渡す scene_format=Rgba16Float へ解決される）。

shader_sources  = ["shader_common.wgsl", "shadow.wgsl", "rt_shadow_off.wgsl", "shader_static_vertex.wgsl", "shader_fragment.wgsl"]
vertex_entry    = "vs_main"
fragment_entry  = "fs_main"
vertex_slots    = ["mesh_vertex"]

topology        = "TriangleList"
cull_mode       = "Back"
front_face      = "Ccw"

depth_write     = false
depth_compare   = "LessEqual"

color_format    = "surface"
blend           = "AlphaBlending"
write_mask      = "all"
