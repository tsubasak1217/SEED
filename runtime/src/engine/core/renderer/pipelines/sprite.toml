shader_sources  = ["sprite.wgsl"]
vertex_entry    = "vs_main"
fragment_entry  = "fs_main"
# slot0 = ユニットクワッド頂点（per-vertex）, slot1 = per-instance データ（Phase R6）
vertex_slots    = ["sprite_vertex", "sprite_instance"]

topology        = "TriangleList"
cull_mode       = "None"
front_face      = "Ccw"

# スプライトは深度書き込みなし・半透明合成
depth_write     = false
depth_compare   = "LessEqual"

color_format    = "surface"
blend           = "AlphaBlending"
write_mask      = "all"
