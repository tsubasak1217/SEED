shader_sources  = ["sprite_outline.wgsl"]
vertex_entry    = "vs_main"
fragment_entry  = "fs_main"
# slot0 = ユニットクワッド頂点, slot1 = per-instance データ（sprite と同一, Phase R6）
vertex_slots    = ["sprite_vertex", "sprite_instance"]
# テクスチャ・uniform 不要のため 1 グループ（camera のみ）
num_bind_groups = 1

topology        = "TriangleList"
cull_mode       = "None"
front_face      = "Ccw"

# 3D アウトラインと同様: 深度テストあり・書き込みなし（深度で遮蔽される）
depth_write     = false
depth_compare   = "LessEqual"

color_format    = "surface"
blend           = "AlphaBlending"
write_mask      = "all"
