shader_sources  = ["cluster_common.wgsl", "pbr_common.wgsl", "shader_common.wgsl", "ddgi_common.wgsl", "light_common.wgsl", "shadow.wgsl", "rt_shadow_off.wgsl", "shader_static_vertex.wgsl", "surface.wgsl", "surface_gather.wgsl", "lighting_eval.wgsl", "shader_fragment.wgsl"]
vertex_entry    = "vs_main"
fragment_entry  = "fs_main"
vertex_slots    = ["mesh_vertex"]

topology        = "TriangleList"
cull_mode       = "Back"
front_face      = "Ccw"

depth_write     = true
depth_compare   = "Less"

color_format    = "surface"
blend           = "Replace"
write_mask      = "all"
