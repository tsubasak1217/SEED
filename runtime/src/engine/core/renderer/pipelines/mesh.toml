shader_sources  = ["shader_common.wgsl", "shader_static_vertex.wgsl", "shader_fragment.wgsl"]
vertex_entry    = "vs_main"
fragment_entry  = "fs_main"
vertex_slots    = ["mesh_vertex"]

topology        = "TriangleList"
cull_mode       = "Back"
front_face      = "Ccw"

depth_write     = true
depth_compare   = "Less"

color_format    = "surface"
blend           = "Replace"
write_mask      = "all"
