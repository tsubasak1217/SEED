# ============================================================
#  .cargo/config.toml — Cargo ローカル設定
#
#  ワークスペースルート (SEED/) に Cargo.toml が存在するため、
#  デフォルトでは target/ は SEED/target/ に置かれる。
#  エディタは runtime/target/debug/SEED.exe を起動するため、
#  ここで target-dir を明示的に指定してビルド出力先を揃える。
# ============================================================

[build]
# ビルド成果物を runtime/target/ に配置する（ワークスペースターゲットではなく）
target-dir = "target"
