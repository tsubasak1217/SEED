# ============================================================
#  gradle.properties — SEED ランタイム Android プロジェクト共通の Gradle 設定
#
#  マシン固有のパス（SDK / NDK / JDK の場所）はここに書かない。
#    SDK … 環境変数 ANDROID_HOME（または ANDROID_SDK_ROOT）を AGP が読む（SeedAndroid は見つけた SDK を ANDROID_HOME に入れて起動する）
#    NDK … SeedAndroid が見つけた NDK（ANDROID_NDK_HOME か SDK の ndk/）を -Pseed.ndkPath=... で渡す
#    JDK … 環境変数 JAVA_HOME（gradlew が読む。SeedAndroid は見つけた JDK を入れて起動する）
# ============================================================

# Gradle デーモンの最大ヒープ。AGP の dex 変換・APK 詰めに十分な量。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# AndroidX を使う（GameActivity は AppCompatActivity 派生）。
android.useAndroidX=true

# R クラスを各モジュールのリソースだけに限定する（ビルドが速く、名前の衝突も起きない）。
android.nonTransitiveRClass=true
