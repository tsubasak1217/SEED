name: CI Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build & Test (Release)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Restore .NET dependencies
      run: dotnet restore editor/SEEDEditor.sln

    - name: Build .NET Editor (Release)
      run: dotnet build editor/SEEDEditor.sln --configuration Release --no-restore

    - name: Build Rust Runtime (Release)
      run: |
        cd runtime
        cargo build --release --verbose

    - name: Run Rust Tests (Release)
      run: |
        cd runtime
        cargo test --release --verbose
