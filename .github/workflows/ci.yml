name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Restore .NET dependencies
      run: dotnet restore editor/SEEDEditor.sln

    - name: Build .NET Editor (${{ matrix.configuration }})
      run: dotnet build editor/SEEDEditor.sln --configuration ${{ matrix.configuration }} --no-restore

    - name: Build Rust Runtime (${{ matrix.configuration }})
      run: |
        cd runtime
        if ("${{ matrix.configuration }}" -eq "Release") {
          cargo build --release --verbose
        } else {
          cargo build --verbose
        }

    - name: Run Rust Tests (${{ matrix.configuration }})
      run: |
        cd runtime
        if ("${{ matrix.configuration }}" -eq "Release") {
          cargo test --release --verbose
        } else {
          cargo test --verbose
        }
