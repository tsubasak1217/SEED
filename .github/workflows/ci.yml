name: CI Debug

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-debug:
    name: Build (Debug) - Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── .NET エディタ ────────────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore editor/SEEDEditor.sln

      - name: Build .NET Editor (Debug)
        run: dotnet build editor/SEEDEditor.sln --configuration Debug --no-restore

      # ── Rust ランタイム ──────────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime -> runtime/target

      - name: Build Rust Runtime (Debug)
        working-directory: runtime
        run: cargo build --verbose
